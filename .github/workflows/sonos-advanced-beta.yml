name: Validate Sonos Advanced Beta

on:
  push:
    branches: ["sonos-beta"]
    paths:
      - Apps/SonosAdvancedApp.groovy
      - Drivers/Component/SonosAdv*.groovy
      - Libraries/SMAPILibrary.groovy
      - Libraries/UtilitiesAndLoggingLibrary.groovy
      - tests/**
      - .github/workflows/sonos-advanced-beta.yml
  workflow_dispatch:

jobs:
  validate:
    name: Validate Sonos Advanced Beta
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run Sonos regression tests
        working-directory: tests
        run: >-
          ./gradlew test
          --tests "dwinks.hubitat.functional.SonosAdvGroupSpec"
          --tests "dwinks.hubitat.functional.SonosAdvPlayerSpec"
          --tests "dwinks.hubitat.functional.SonosAdvancedAppSpec.unlisted-player eviction*"
          --tests "dwinks.hubitat.functional.SonosAdvancedAppSpec.group operation target*"
          --tests "dwinks.hubitat.functional.SonosAdvancedAppSpec.group definition lookup*"
          --tests "dwinks.hubitat.functional.SonosAdvancedAppSpec.eviction operation retains*"
          --tests "dwinks.hubitat.functional.SonosAdvancedAppSpec.explicit grouping*"
          --tests "dwinks.hubitat.functional.SonosAdvancedAppSpec.additive grouping*"
          --tests "dwinks.hubitat.functional.SonosAdvancedAppSpec.topology*"
          --tests "dwinks.hubitat.functional.SonosAdvancedAppSpec.cached topology*"

      - name: Lint Sonos Advanced sources
        working-directory: tests
        run: ./gradlew lint
