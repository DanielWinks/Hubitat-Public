name: Release Sonos Advanced Controller

on:
  workflow_dispatch:
    inputs:
      version_increment:
        description: "Version increment type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor

jobs:
  release:
    name: Release Sonos Advanced Controller
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      copilot-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Get current version and calculate new version
        id: version
        run: |
          # Extract current version from packageManifest.json
          CURRENT_VERSION=$(jq -r '.version' PackageManifests/SonosAdvancedController/packageManifest.json)
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          # Parse version
          IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"

          # Increment based on input
          if [ "${{ github.event.inputs.version_increment }}" == "minor" ]; then
            minor=$((minor + 1))
            patch=0
          else
            patch=$((patch + 1))
          fi

          NEW_VERSION="${major}.${minor}.${patch}"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Incrementing from $CURRENT_VERSION to $NEW_VERSION"

      - name: Generate release notes with GitHub Copilot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CURRENT_VERSION: ${{ steps.version.outputs.current_version }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          VERSION_INCREMENT: ${{ inputs.version_increment }}
        run: |
          npm install --global @github/copilot

          python3 - <<'PY'
          import os
          import json
          import re
          import subprocess
          from pathlib import Path

          current_version = os.environ["CURRENT_VERSION"]
          new_version = os.environ["NEW_VERSION"]
          increment = os.environ["VERSION_INCREMENT"]
          major, minor, _ = (int(part) for part in new_version.split("."))

          # A minor release starts its summary at the immediately preceding release.
          # A patch release rebuilds the complete current-minor summary from code history
          # and receives the previously published notes as context to preserve details.
          tags = subprocess.check_output(
              ["git", "tag", "--list", "v*", "--sort=-version:refname"], text=True
          ).splitlines()
          parsed_tags = []
          for candidate in tags:
              match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", candidate)
              if match:
                  version = tuple(int(part) for part in match.groups())
                  parsed_tags.append((version, candidate))

          if increment == "minor":
              base_tag = f"v{current_version}"
          else:
              previous_minor = [
                  (version, tag) for version, tag in parsed_tags
                  if version[0] == major and version[1] < minor
              ]
              base_tag = max(previous_minor)[1] if previous_minor else None

          base_exists = bool(base_tag) and subprocess.run(
              ["git", "rev-parse", "--verify", "--quiet", f"refs/tags/{base_tag}"],
              check=False,
          ).returncode == 0
          if base_exists:
              commit_range = f"{base_tag}..HEAD"
              commits = subprocess.check_output(
                  ["git", "log", commit_range, "--no-merges", "--pretty=format:- %s"], text=True
              )
              diff = subprocess.check_output(
                  ["git", "diff", "--no-ext-diff", "--unified=2", commit_range, "--",
                   "Apps/SonosAdvancedApp.groovy", "Drivers/Component/SonosAdv*.groovy",
                   "Libraries/SMAPILibrary.groovy", "Libraries/UtilitiesAndLoggingLibrary.groovy",
                   "Readme/", "README.md", "COMMUNITY_ISSUES_CHECKLIST.md"], text=True
              )
          else:
              commits = subprocess.check_output(
                  ["git", "log", "--no-merges", "--pretty=format:- %s"], text=True
              )
              diff = "No appropriate previous release tag was found; use available commit history as the source of truth."

          manifest = json.loads(Path("PackageManifests/SonosAdvancedController/packageManifest.json").read_text())
          existing_minor_notes = []
          if increment == "patch":
              note_text = manifest.get("releaseNotes", "")
              entries = re.split(r"(?:\\r\\n|\r\n|\n)(?=\d+\.\d+\.\d+)", note_text)
              prefix = f"{major}.{minor}."
              existing_minor_notes = [
                  entry.strip() for entry in entries if re.match(r"\s*" + re.escape(prefix) + r"\d+\b", entry)
              ]

          if not commits.strip():
              commits = "No Sonos Advanced commits found in the selected release range."
          diff = diff[:60000]
          existing_notes = "\n\n".join(existing_minor_notes) or "No previous summary exists for this minor-version line."
          release_scope = (
              f"This is a patch release. Produce the complete cumulative summary for {major}.{minor}.x. "
              "Carry forward every user-visible change in the existing notes and add all additional changes evidenced by the full code history. Consolidate duplicates without dropping distinct functionality."
              if increment == "patch" else
              f"This is the first release in minor version {major}.{minor}. Summarize all user-visible changes since the previous release tag."
          )
          prompt = f"""Write concise, user-facing, cumulative release notes for Sonos Advanced Controller version {new_version}.
          {release_scope}
          Treat the existing summary as information to preserve, not as a replacement for reviewing the code history. Summarize only user-visible changes supported by these sources. Group related changes into clear bullets. Omit internal version bumps, generated-only changes, and speculative claims. Output Markdown bullets only, with no heading or preamble. If there are no meaningful user-visible changes, say so plainly.

          Existing summary for this minor-version line:
          {existing_notes}

          Commits in the cumulative release range beginning at {base_tag or 'available repository history'}:
          {commits}

          Sonos Advanced source and documentation diff for the cumulative release range (may be truncated):
          {diff}
          """
          Path("copilot-prompt.md").write_text(prompt)
          PY

          copilot -s < copilot-prompt.md > release-notes.md
          test -s release-notes.md
          cat release-notes.md


      - name: Update version in all Sonos Advanced files
        run: |
          OLD_VERSION="${{ steps.version.outputs.current_version }}"
          NEW_VERSION="${{ steps.version.outputs.new_version }}"

          echo "Updating version from $OLD_VERSION to $NEW_VERSION"

          # Update App version
          sed -i "s/version: '$OLD_VERSION'/version: '$NEW_VERSION'/" Apps/SonosAdvancedApp.groovy

          # Update all Driver versions
          sed -i "s/version: '$OLD_VERSION'/version: '$NEW_VERSION'/" Drivers/Component/SonosAdvPlayer.groovy
          sed -i "s/version: '$OLD_VERSION'/version: '$NEW_VERSION'/" Drivers/Component/SonosAdvGroup.groovy
          sed -i "s/version: '$OLD_VERSION'/version: '$NEW_VERSION'/" Drivers/Component/SonosAdvSnapshot.groovy
          sed -i "s/version: '$OLD_VERSION'/version: '$NEW_VERSION'/" Drivers/Component/SonosAdvBatteryStats.groovy
          sed -i "s/version: '$OLD_VERSION'/version: '$NEW_VERSION'/" Drivers/Component/SonosAdvFavorites.groovy
          sed -i "s/version: '$OLD_VERSION'/version: '$NEW_VERSION'/" Drivers/Component/SonosAdvSecondaries.groovy
          sed -i "s/version: '$OLD_VERSION'/version: '$NEW_VERSION'/" Drivers/Component/SonosAdvPlaylist.groovy

          # Update Library versions
          sed -i "s/version: '$OLD_VERSION'/version: '$NEW_VERSION'/" Libraries/SMAPILibrary.groovy
          sed -i "s/version: '$OLD_VERSION'/version: '$NEW_VERSION'/" Libraries/UtilitiesAndLoggingLibrary.groovy

          echo "Version update complete"

      - name: Update packageManifest.json
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          DATE=$(date +%Y-%m-%d)

          # Create Python script to update JSON
          cat > update_manifest.py << 'EOF'
          import json
          import sys
          import os
          import re

          manifest_path = 'PackageManifests/SonosAdvancedController/packageManifest.json'
          new_version = sys.argv[1]
          increment = sys.argv[2]
          with open('release-notes.md', 'r') as f:
              release_notes = f.read().strip()
          date_released = sys.argv[3]

          with open(manifest_path, 'r') as f:
              data = json.load(f)

          # Update version
          data['version'] = new_version

          # Update date
          data['dateReleased'] = date_released

          # Update all location URLs to point to release downloads
          base_release_url = f'https://github.com/DanielWinks/Hubitat-Public/releases/download/v{new_version}'

          # Update app locations
          for app in data.get('apps', []):
              if 'location' in app:
                  filename = app['location'].split('/')[-1]
                  app['location'] = f'{base_release_url}/{filename}'

          # Update driver locations
          for driver in data.get('drivers', []):
              if 'location' in driver:
                  filename = driver['location'].split('/')[-1]
                  driver['location'] = f'{base_release_url}/{filename}'

          # Update bundle locations
          for bundle in data.get('bundles', []):
              if 'location' in bundle:
                  filename = bundle['location'].split('/')[-1]
                  bundle['location'] = f'{base_release_url}/{filename}'

          # Update file locations (for library files)
          for file in data.get('files', []):
              if 'location' in file:
                  filename = file['location'].split('/')[-1]
                  file['location'] = f'{base_release_url}/{filename}'

          # A patch note is the full summary for its minor line, so replace older
          # entries from that same line instead of leaving a partial patch note on top.
          # Minor releases start a new line and preserve all earlier minor history.
          existing_notes = data.get('releaseNotes', '')
          existing_entries = re.split(r"(?:\\r\\n|\r\n|\n)(?=\d+\.\d+\.\d+)", existing_notes)
          major, minor, _ = (int(part) for part in new_version.split('.'))
          if increment == 'patch':
              same_minor = re.compile(r'^\s*' + re.escape(f'{major}.{minor}.') + r'\d+\b')
              existing_entries = [entry for entry in existing_entries if not same_minor.match(entry)]
          new_notes = f"{new_version} - {release_notes}"
          data['releaseNotes'] = "\r\n".join([new_notes] + [entry.strip() for entry in existing_entries if entry.strip()])

          with open(manifest_path, 'w') as f:
              json.dump(data, f, indent=2)

          print(f"Updated manifest to version {new_version}")
          print(f"Updated all URLs to point to release v{new_version}")
          EOF

          python3 update_manifest.py "$NEW_VERSION" "${{ inputs.version_increment }}" "$DATE"

      - name: Assemble release changelog
        id: changelog
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"

          RELEASE_NOTES=$(cat release-notes.md)

          # Save to file for use in release
          cat > changelog.md << EOF
          ## Sonos Advanced Controller ${NEW_VERSION}

          ### Release Notes
          ${RELEASE_NOTES}

          ### Files Updated
          - SonosAdvancedApp.groovy
          - SonosAdvPlayer.groovy
          - SonosAdvGroup.groovy
          - SonosAdvSnapshot.groovy
          - SonosAdvBatteryStats.groovy
          - SonosAdvFavorites.groovy
          - SonosAdvSecondaries.groovy
          - SonosAdvPlaylist.groovy
          - packageManifest.json
          EOF

          echo "Changelog generated"

      - name: Commit version updates
        uses: EndBug/add-and-commit@v10
        with:
          add: |
            Apps/SonosAdvancedApp.groovy
            Drivers/Component/SonosAdvPlayer.groovy
            Drivers/Component/SonosAdvGroup.groovy
            Drivers/Component/SonosAdvSnapshot.groovy
            Drivers/Component/SonosAdvBatteryStats.groovy
            Drivers/Component/SonosAdvFavorites.groovy
            Drivers/Component/SonosAdvSecondaries.groovy
            Drivers/Component/SonosAdvPlaylist.groovy
            Drivers/Component/SonosAdvQueue.groovy
            Drivers/Component/SonosAdvSleepTimer.groovy
            Drivers/Component/SonosAdvAlarmSwitch.groovy
            Drivers/Component/SonosAdvAlarmManager.groovy
            Libraries/SMAPILibrary.groovy
            Libraries/UtilitiesAndLoggingLibrary.groovy
            PackageManifests/SonosAdvancedController/packageManifest.json
          message: "Release Sonos Advanced Controller ${{ steps.version.outputs.new_version }}"
          tag: "v${{ steps.version.outputs.new_version }}"
          push: true

      - name: Trigger and wait for UtilitiesAndLoggingLibrary workflow
        uses: actions/github-script@v7
        with:
          script: |
            // Trigger the workflow
            const utilWorkflow = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'UtilitiesAndLoggingLibrary.yml',
              ref: 'main'
            });
            console.log('Triggered UtilitiesAndLoggingLibrary workflow');

            // Wait for it to start and complete
            let attempts = 0;
            const maxAttempts = 60; // 5 minutes max

            while (attempts < maxAttempts) {
              await new Promise(resolve => setTimeout(resolve, 5000)); // Wait 5 seconds

              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'UtilitiesAndLoggingLibrary.yml',
                branch: 'main',
                per_page: 5
              });

              // Find the most recent run
              const latestRun = runs.data.workflow_runs[0];

              if (latestRun && latestRun.status === 'completed') {
                if (latestRun.conclusion === 'success') {
                  console.log('UtilitiesAndLoggingLibrary workflow completed successfully');
                  break;
                } else {
                  throw new Error(`UtilitiesAndLoggingLibrary workflow failed with conclusion: ${latestRun.conclusion}`);
                }
              }

              attempts++;
              console.log(`Waiting for UtilitiesAndLoggingLibrary workflow... (attempt ${attempts}/${maxAttempts})`);
            }

            if (attempts >= maxAttempts) {
              throw new Error('UtilitiesAndLoggingLibrary workflow did not complete in time');
            }

      - name: Trigger and wait for SonosAdvancedBundles workflow
        uses: actions/github-script@v7
        with:
          script: |
            // Trigger the workflow
            const bundleWorkflow = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'SonosAdvancedBundles.yml',
              ref: 'main'
            });
            console.log('Triggered SonosAdvancedBundles workflow');

            // Wait for it to start and complete
            let attempts = 0;
            const maxAttempts = 60; // 5 minutes max

            while (attempts < maxAttempts) {
              await new Promise(resolve => setTimeout(resolve, 5000)); // Wait 5 seconds

              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'SonosAdvancedBundles.yml',
                branch: 'main',
                per_page: 5
              });

              // Find the most recent run
              const latestRun = runs.data.workflow_runs[0];

              if (latestRun && latestRun.status === 'completed') {
                if (latestRun.conclusion === 'success') {
                  console.log('SonosAdvancedBundles workflow completed successfully');
                  break;
                } else {
                  throw new Error(`SonosAdvancedBundles workflow failed with conclusion: ${latestRun.conclusion}`);
                }
              }

              attempts++;
              console.log(`Waiting for SonosAdvancedBundles workflow... (attempt ${attempts}/${maxAttempts})`);
            }

            if (attempts >= maxAttempts) {
              throw new Error('SonosAdvancedBundles workflow did not complete in time');
            }

      - name: Pull latest changes from sub-workflows
        run: |
          # The UtilitiesAndLoggingLibrary and SonosAdvancedBundles workflows
          # each committed updated bundle files to main. Our local checkout is
          # stale and still has the OLD bundles/libraries from before those
          # workflows ran. We must pull so the release uploads the freshly-built
          # bundle zips and library files.
          git pull --rebase --autostash origin main
          echo "Local checkout updated with latest bundle artifacts"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          name: Sonos Advanced Controller ${{ steps.version.outputs.new_version }}
          body_path: changelog.md
          draft: false
          prerelease: false
          files: |
            Bundles/SonosAdvancedController.zip
            Bundles/UtilitiesAndLoggingLibrary.zip
            Apps/SonosAdvancedApp.groovy
            Drivers/Component/SonosAdvPlayer.groovy
            Drivers/Component/SonosAdvGroup.groovy
            Drivers/Component/SonosAdvSnapshot.groovy
            Drivers/Component/SonosAdvBatteryStats.groovy
            Drivers/Component/SonosAdvFavorites.groovy
            Drivers/Component/SonosAdvSecondaries.groovy
            Drivers/Component/SonosAdvPlaylist.groovy
            Drivers/Component/SonosAdvQueue.groovy
            Drivers/Component/SonosAdvSleepTimer.groovy
            Drivers/Component/SonosAdvAlarmSwitch.groovy
            Drivers/Component/SonosAdvAlarmManager.groovy
            Libraries/SMAPILibrary.groovy
            Libraries/UtilitiesAndLoggingLibrary.groovy
            PackageManifests/SonosAdvancedController/packageManifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Discussion Announcement
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const changelog = fs.readFileSync('changelog.md', 'utf8');

            try {
              // Get the "Announcements" category ID
              const categories = await github.graphql(`
                query($owner: String!, $repo: String!) {
                  repository(owner: $owner, name: $repo) {
                    discussionCategories(first: 10) {
                      nodes {
                        id
                        name
                      }
                    }
                  }
                }
              `, {
                owner: context.repo.owner,
                repo: context.repo.repo
              });

              const announcementCategory = categories.repository.discussionCategories.nodes.find(
                cat => cat.name === 'Announcements'
              );

              if (!announcementCategory) {
                console.log('Announcements category not found, skipping discussion creation');
                return;
              }

              // Create discussion
              await github.graphql(`
                mutation($repositoryId: ID!, $categoryId: ID!, $title: String!, $body: String!) {
                  createDiscussion(input: {
                    repositoryId: $repositoryId,
                    categoryId: $categoryId,
                    title: $title,
                    body: $body
                  }) {
                    discussion {
                      url
                    }
                  }
                }
              `, {
                repositoryId: context.payload.repository.node_id,
                categoryId: announcementCategory.id,
                title: `Sonos Advanced Controller ${{ steps.version.outputs.new_version }} Released`,
                body: changelog
              });

              console.log('Discussion announcement created successfully');
            } catch (error) {
              console.log('Could not create discussion:', error.message);
            }

      - name: Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # Release Complete! 🎉

          ## Version
          - **From:** ${{ steps.version.outputs.current_version }}
          - **To:** ${{ steps.version.outputs.new_version }}

          ## What was done
          1. ✅ Updated version numbers in all Sonos Advanced files
          2. ✅ Triggered UtilitiesAndLoggingLibrary workflow
          3. ✅ Triggered SonosAdvancedBundles workflow
          4. ✅ Updated packageManifest.json with new version and release notes
          5. ✅ Created git tag: v${{ steps.version.outputs.new_version }}
          6. ✅ Created GitHub Release with bundles
          7. ✅ Created discussion announcement

          ## Next Steps
          - Verify the release at: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.new_version }}
          - Check that bundles were generated correctly
          - Announce the release to the Hubitat community if desired
          EOF
